# Deploy: Render → New → Blueprint → connect github.com/segnig/word_duel
services:
  - type: worker
    name: word-duel-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: word_duel
      - key: WORD_LENGTH
        value: "5"
      - key: MAX_ROUNDS
        value: "10"
